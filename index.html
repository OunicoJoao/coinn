<!DOCTYPE html>
<!--
  index.html
  Página principal: saldo, formulário de lançamento e histórico de movimentações.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- A ordem importa: regras.js e storage.js precisam vir antes de app.js, que usa os dois -->
    <script src="js/regras.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <!-- Barra do topo: logo à esquerda, ações à direita -->
    <header class="topbar">
        <div class="topbar-conteudo">

            <!--logo da coinn-->
            <a href="./index.html" class="logo" aria-label="Coinn, página inicial">
                <img src="./img/real-brasileiro.png" alt="" class="logo-icone">
                <h1>Coinn</h1>
            </a>

            <div class="topbar-acoes">
                <!-- Mostrar / ocultar valores -->
                <button type="button" id="btn-visibilidade" class="btn-topbar"
                        aria-pressed="false" aria-label="Ocultar valores" title="Ocultar valores">
                    <!-- olho aberto (valores visíveis) -->
                    <svg class="icone icone-olho" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <!-- olho riscado (valores ocultos) -->
                    <svg class="icone icone-olho-fechado" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9.9 4.2A10.4 10.4 0 0 1 12 4c6.4 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2"/>
                        <path d="M6.6 6.6C3.9 8.4 2 12 2 12s3.6 8 10 8a9.7 9.7 0 0 0 5.4-1.6"/>
                        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                        <path d="M2 2l20 20"/>
                    </svg>
                </button>

                <!-- Exportar / importar dados -->
                <div class="menu-dados">
                    <button type="button" id="btn-dados" class="btn-topbar btn-dados"
                            aria-haspopup="true" aria-expanded="false" aria-controls="menu-dados"
                            title="Exportar ou importar dados">
                        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 4v16"/><path d="M3 8l4-4 4 4"/>
                            <path d="M17 20V4"/><path d="M21 16l-4 4-4-4"/>
                        </svg>
                        <span class="btn-dados-texto">Exportar / Importar</span>
                    </button>

                    <div id="menu-dados" class="menu-dados-lista" hidden>
                        <button type="button" id="btn-exportar" class="menu-item">
                            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/>
                            </svg>
                            <span>
                                Exportar dados
                                <small>Baixa um arquivo .json com suas movimentações</small>
                            </span>
                        </button>
                        <button type="button" id="btn-importar" class="menu-item">
                            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 21h16"/>
                            </svg>
                            <span>
                                Importar dados
                                <small>Carrega um arquivo exportado pela Coinn</small>
                            </span>
                        </button>
                    </div>

                    <!-- Escondido: aberto pelo botão "Importar dados" -->
                    <input type="file" id="arquivo-importar" accept=".json,application/json" hidden>
                </div>
            </div>

        </div>
    </header>

    <main class="container">

        <!-- #18 Consultar saldo -->
        <section class="saldo-container" aria-label="Resumo">
            <h2>Seu saldo</h2>
            <!--&nbsp; faz com que não quebre a linha (descobri isso e ajuda muito kkk)-->
            <p id="saldo" class="saldo">R$&nbsp;0,00</p>

            <div class="resumo">
                <div class="resumo-entradas">
                    <h3>Entradas</h3>
                    <p id="total-entradas">R$&nbsp;0,00</p>
                </div>
                <div class="resumo-saidas">
                    <h3>Saídas</h3>
                    <p id="total-saidas">R$&nbsp;0,00</p>
                </div>
            </div>
        </section>

        <div class="conteudo">

            <!-- #19 Ver histórico -->
            <section class="historico-container">
                <div class="historico-cabecalho">
                    <h2>Histórico</h2>
                    <!-- Limpar tudo: apaga todas as movimentações (pede confirmação) -->
                    <button type="button" id="btn-limpar-tudo" class="btn-limpar" hidden>Limpar tudo</button>
                </div>

                <!-- Filtros do histórico (não alteram o saldo, só o que aparece na lista) -->
                <div id="filtros" class="filtros" hidden>
                    <div class="filtro">
                        <label for="filtro-tipo">Tipo</label>
                        <select id="filtro-tipo">
                            <option value="todas">Todas</option>
                            <option value="entrada">Entradas</option>
                            <option value="saida">Saídas</option>
                        </select>
                    </div>
                    <div class="filtro">
                        <label for="filtro-mes">Mês</label>
                        <select id="filtro-mes">
                            <!--Opções de mês adicionadas via Javascript-->
                            <option value="todos">Todos os meses</option>
                        </select>
                    </div>
                    <div class="filtro">
                        <label for="filtro-categoria">Categoria</label>
                        <select id="filtro-categoria">
                            <!--Opções de categoria adicionadas via Javascript (só as que estão em uso)-->
                        </select>
                    </div>
                    <div class="filtro">
                        <label for="filtro-subcategoria">Subcategoria</label>
                        <!-- Só fica ativo depois de escolher uma categoria -->
                        <select id="filtro-subcategoria" disabled>
                            <!--Opções de subcategoria adicionadas via Javascript-->
                        </select>
                    </div>
                </div>

                <!-- Total das movimentações filtradas (só aparece com algum filtro ativo) -->
                <div class="filtro-resumo">
                    <p id="total-filtrado" class="total-filtrado" aria-live="polite" hidden></p>
                    <button type="button" id="btn-limpar-filtros" class="btn-link" hidden>Limpar filtros</button>
                </div>

                <p id="historico-vazio" class="historico-vazio">Nenhuma movimentação registrada ainda.</p>
                <!--Movimentações adicionadas aqui via Javascript-->
                <ul id="lista-movimentacoes"></ul>
            </section>

            <!-- #17 Registrar movimentação -->
            <!-- O mesmo formulário também é usado para Editar movimentação -->
            <section id="form-container" class="form-container">
                <h2 id="titulo-form">Nova movimentação</h2>

                <form id="form-movimentacao" novalidate>
                    <fieldset class="form-grupo tipo-grupo">
                        <legend>Tipo</legend>
                        <div class="tipo-opcoes">
                            <label class="tipo-opcao entrada">
                                <input type="radio" name="tipo" value="entrada" checked>
                                <span>Entrada</span>
                            </label>
                            <label class="tipo-opcao saida">
                                <input type="radio" name="tipo" value="saida">
                                <span>Saída</span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Categoria e subcategoria: texto livre, com sugestões do que já foi usado -->
                    <div class="form-linha">
                        <div class="form-grupo">
                            <div class="label-linha">
                                <label for="categoria">Categoria</label>
                                <small>opcional</small>
                            </div>
                            <input type="text" id="categoria" list="sugestoes-categoria"
                                   placeholder="Ex.: Alimentação" maxlength="20" autocomplete="off">
                            <datalist id="sugestoes-categoria"></datalist>
                        </div>
                        <div class="form-grupo">
                            <div class="label-linha">
                                <label for="subcategoria">Subcategoria</label>
                                <small>opcional</small>
                            </div>
                            <input type="text" id="subcategoria" list="sugestoes-subcategoria"
                                   placeholder="Ex.: Mercado" maxlength="20" autocomplete="off">
                            <datalist id="sugestoes-subcategoria"></datalist>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="valor">Valor (R$)</label>
                        <input type="number" id="valor" placeholder="0,00"
                               min="0.01" max="999999.99" step="0.01"
                               inputmode="decimal" required>
                    </div>

                    <div class="form-grupo">
                        <label for="data">Data</label>
                        <input type="date" id="data" required>
                    </div>

                    <div class="form-grupo">
                        <div class="label-linha">
                            <label for="descricao">Descrição</label>
                            <small id="contador-descricao" aria-live="polite">0/30</small>
                        </div>
                        <input type="text" id="descricao" placeholder="Ex.: Mercado, salário..."
                               maxlength="30" autocomplete="off" required>
                    </div>

                    <p id="mensagem-erro" class="mensagem-erro" role="alert" hidden></p>

                    <div class="form-botoes">
                        <button type="submit" id="btn-registrar">Registrar</button>
                        <button type="button" id="btn-cancelar-edicao" class="btn-cancelar" hidden>Cancelar edição</button>
                    </div>
                </form>
            </section>

        </div>
    </main>

    <!-- Aviso rápido (ex.: "Dados exportados") -->
    <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
</body>
</html>
